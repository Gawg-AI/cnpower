[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnpower"
version = "1.0.0"
description = "Chinese 10kV/0.4kV distribution grid engineering parameter library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gawg-AI", email = "ahx@qq.com"},
]
keywords = [
    "distribution-grid",
    "pandapower",
    "power-system",
    "chinese-standards",
    "gb-t",
    "electrical-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
pandapower = ["pandapower>=3.4,<4"]
test = ["pytest>=8", "cnpower[pandapower]"]
dev = ["pytest>=8", "cnpower[pandapower]"]

[project.urls]
Homepage = "https://github.com/Gawg-AI/cnpower"
Documentation = "https://github.com/Gawg-AI/cnpower#readme"
Repository = "https://github.com/Gawg-AI/cnpower"
Issues = "https://github.com/Gawg-AI/cnpower/issues"

[tool.setuptools.packages.find]
include = ["cnpower*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
